<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Área Infantil</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="view-desktop" class="view">
  <button id="botao-config" class="botao-config" aria-label="Configurações">
    <img src="assets/icon-config.svg" alt="">
  </button>
  <h1 class="titulo-area">Área Infantil</h1>
  <div id="grade-apps" class="grade"></div>
</main>

<main id="view-historias" class="view hidden">
  <button class="botao-voltar" data-voltar="desktop">← Voltar</button>
  <h1 class="titulo-area">Histórias</h1>
  <div id="grade-historias" class="grade"></div>
</main>

<main id="view-jogos" class="view hidden">
  <button class="botao-voltar" data-voltar="desktop">← Voltar</button>
  <h1 class="titulo-area">Jogos</h1>
  <div id="grade-jogos" class="grade"></div>
</main>

<main id="view-cobrinha" class="view hidden">
  <button class="botao-voltar" data-voltar="jogos">← Voltar</button>
  <div class="jogo-cobrinha">
    <span id="cobrinha-pontos" class="jogo-pontos">Pontos: 0</span>
    <canvas id="cobrinha-canvas" width="260" height="260"></canvas>
    <div id="cobrinha-fim" class="jogo-fim hidden">
      <p>Fim de jogo!</p>
      <button id="cobrinha-reiniciar" class="botao-voltar">Jogar de novo</button>
    </div>
    <div class="dpad">
      <button class="dpad-btn dpad-cima" data-dir="cima" aria-label="Cima">▲</button>
      <div class="dpad-meio">
        <button class="dpad-btn dpad-esquerda" data-dir="esquerda" aria-label="Esquerda">◀</button>
        <button class="dpad-btn dpad-direita" data-dir="direita" aria-label="Direita">▶</button>
      </div>
      <button class="dpad-btn dpad-baixo" data-dir="baixo" aria-label="Baixo">▼</button>
    </div>
  </div>
</main>

<main id="view-tetris" class="view hidden">
  <button class="botao-voltar" data-voltar="jogos">← Voltar</button>
  <div class="jogo-tetris">
    <span id="tetris-pontos" class="jogo-pontos">Pontos: 0</span>
    <canvas id="tetris-canvas" width="180" height="320"></canvas>
    <div id="tetris-fim" class="jogo-fim hidden">
      <p>Fim de jogo!</p>
      <button id="tetris-reiniciar" class="botao-voltar">Jogar de novo</button>
    </div>
    <div class="dpad">
      <button class="dpad-btn" data-tetris="girar" aria-label="Girar">↻</button>
      <div class="dpad-meio">
        <button class="dpad-btn" data-tetris="esquerda" aria-label="Esquerda">◀</button>
        <button class="dpad-btn" data-tetris="direita" aria-label="Direita">▶</button>
      </div>
      <button class="dpad-btn" data-tetris="baixo" aria-label="Descer">▼</button>
    </div>
  </div>
</main>

<div id="modal-pin" class="modal hidden">
  <div class="modal-caixa">
    <p>Digite o PIN dos pais</p>
    <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <p id="pin-erro" class="pin-erro hidden">PIN incorreto</p>
    <div class="modal-botoes">
      <button id="pin-cancelar" class="botao-voltar">Cancelar</button>
      <button id="pin-confirmar" class="botao-play-pequeno">Entrar</button>
    </div>
  </div>
</div>

<main id="view-player" class="view hidden">
  <button class="botao-voltar" data-voltar="historias">← Voltar</button>
  <h1 id="player-titulo" class="titulo-area"></h1>
  <img id="player-capa" class="player-capa" alt="">
  <audio id="player-audio"></audio>
  <div class="player-controles">
    <button id="player-playpause" class="botao-play" aria-label="Tocar/pausar">▶</button>
    <input id="player-timeline" type="range" min="0" max="100" value="0" aria-label="Linha do tempo da história">
    <span id="player-tempo" class="player-tempo">0:00 / 0:00</span>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
