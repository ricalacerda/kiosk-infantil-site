<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Área Infantil</title>
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<main id="view-desktop" class="view">
  <button id="botao-config" class="botao-config" aria-label="Configurações">
    <img src="assets/icon-config.svg" alt="">
  </button>
  <h1 class="titulo-area">Área Infantil</h1>
  <div id="grade-apps" class="grade"></div>
</main>

<main id="view-historias" class="view hidden">
  <button class="botao-voltar" data-voltar="desktop">← Voltar</button>
  <h1 class="titulo-area">Histórias</h1>
  <div id="grade-historias" class="grade"></div>
</main>

<main id="view-jogos" class="view hidden">
  <button class="botao-voltar" data-voltar="desktop">← Voltar</button>
  <h1 class="titulo-area">Jogos</h1>
  <div id="grade-jogos" class="grade"></div>
</main>

<main id="view-cobrinha" class="view view-jogo hidden">
  <div class="jogo-topo">
    <button class="botao-voltar" data-voltar="jogos" aria-label="Voltar">←</button>
    <span class="jogo-nome">COBRINHA</span>
    <span id="cobrinha-pontos" class="jogo-pontos">0000</span>
  </div>
  <div id="cobrinha-tela" class="jogo-tela">
    <canvas id="cobrinha-canvas"></canvas>
  </div>
  <div class="controles controles-cruz">
    <button class="tecla tecla-cima" data-dir="cima" aria-label="Cima">▲</button>
    <button class="tecla tecla-esquerda" data-dir="esquerda" aria-label="Esquerda">◀</button>
    <button class="tecla tecla-direita" data-dir="direita" aria-label="Direita">▶</button>
    <button class="tecla tecla-baixo" data-dir="baixo" aria-label="Baixo">▼</button>
  </div>
  <div id="cobrinha-fim" class="jogo-fim hidden">
    <p>Fim de jogo!</p>
    <p id="cobrinha-fim-pontos" class="jogo-fim-pontos"></p>
    <div class="modal-botoes">
      <button id="cobrinha-reiniciar" class="botao-play-pequeno">Jogar de novo</button>
      <button id="cobrinha-fim-voltar" class="botao-voltar">Voltar</button>
    </div>
  </div>
</main>

<main id="view-tetris" class="view view-jogo hidden">
  <div class="jogo-topo">
    <button class="botao-voltar" data-voltar="jogos" aria-label="Voltar">←</button>
    <span class="jogo-nome">TETRIS</span>
    <span id="tetris-pontos" class="jogo-pontos">0000</span>
  </div>
  <div id="tetris-tela" class="jogo-tela">
    <canvas id="tetris-canvas"></canvas>
  </div>
  <div class="controles controles-tetris">
    <button class="tecla" data-tetris="esquerda" aria-label="Esquerda">◀</button>
    <button class="tecla" data-tetris="baixo" aria-label="Descer">▼</button>
    <button class="tecla" data-tetris="direita" aria-label="Direita">▶</button>
    <button class="tecla tecla-girar" data-tetris="girar" aria-label="Girar">↻</button>
  </div>
  <div id="tetris-fim" class="jogo-fim hidden">
    <p>Fim de jogo!</p>
    <p id="tetris-fim-pontos" class="jogo-fim-pontos"></p>
    <div class="modal-botoes">
      <button id="tetris-reiniciar" class="botao-play-pequeno">Jogar de novo</button>
      <button id="tetris-fim-voltar" class="botao-voltar">Voltar</button>
    </div>
  </div>
</main>

<main id="view-damas" class="view hidden">
  <button class="botao-voltar" data-voltar="jogos">← Voltar</button>
  <div class="jogo-damas">
    <span id="damas-status" class="damas-status">Sua vez</span>
    <div id="damas-tabuleiro" class="damas-tabuleiro"></div>
    <div id="damas-fim" class="jogo-fim hidden">
      <p id="damas-fim-texto">Fim de jogo!</p>
      <div class="modal-botoes">
        <button id="damas-reiniciar" class="botao-play-pequeno">Jogar de novo</button>
        <button id="damas-fim-voltar" class="botao-voltar">Voltar</button>
      </div>
    </div>
  </div>
</main>

<div id="modal-pin" class="modal hidden">
  <div class="modal-caixa">
    <p>Digite o PIN dos pais</p>
    <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <p id="pin-erro" class="pin-erro hidden">PIN incorreto</p>
    <div class="modal-botoes">
      <button id="pin-cancelar" class="botao-voltar">Cancelar</button>
      <button id="pin-confirmar" class="botao-play-pequeno">Entrar</button>
    </div>
  </div>
</div>

<main id="view-player" class="view hidden">
  <button class="botao-voltar" data-voltar="historias">← Voltar</button>
  <h1 id="player-titulo" class="titulo-area"></h1>
  <img id="player-capa" class="player-capa" alt="">
  <audio id="player-audio"></audio>
  <div class="player-controles">
    <button id="player-playpause" class="botao-play" aria-label="Tocar/pausar">▶</button>
    <input id="player-timeline" type="range" min="0" max="100" value="0" aria-label="Linha do tempo da história">
    <span id="player-tempo" class="player-tempo">0:00 / 0:00</span>
  </div>
</main>

<script src="js/app.js?v=5"></script>
</body>
</html>
